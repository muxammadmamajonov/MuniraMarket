name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

permissions: {}

jobs:
  analysis:
    name: Supply-chain security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          # The action requires a local output path even though Scorecard governance findings are
          # intentionally not published into GitHub code scanning.
          results_file: results.sarif
          results_format: sarif
          publish_results: true
