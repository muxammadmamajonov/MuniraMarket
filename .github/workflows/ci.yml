name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Web, admin, packages, telegram
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  api:
    name: Core API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muniramarket_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d muniramarket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test
      # Real Alembic CLI against the CI database (public schema): upgrade, full downgrade, upgrade
      # again, then seed twice to prove the dev seed is idempotent. Tests use per-run schemas.
      - name: Migrations (upgrade / downgrade / upgrade) and idempotent seed
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
          REDIS_URL: redis://localhost:6379/0
          SERVICE_AUTH_KEYS: ci:ci-only-service-key-not-a-secret-000000
          TELEGRAM_BOT_ID: '0'
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
          make seed
          make seed
      # infra/neon: SQL-created migrator/runtime roles, migrations as the migrator, runtime grants;
      # the runtime role must not be able to change or remove audit_log rows or run DDL.
      - name: Neon role model (least privilege, append-only audit log)
        env:
          ADMIN_URL: postgresql://ci:ci-only-password@localhost:5432/postgres
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          ../../infra/neon/scripts/verify-roles.sh
      - run: make build
      - name: Build API container image
        run: docker build --build-arg "APP_RELEASE=ci-${GITHUB_SHA::12}" --tag muniramarket-core-api:ci .
      - name: Smoke-test API container image
        run: >-
          docker run --rm --entrypoint python muniramarket-core-api:ci
          -c "from app.main import create_app; print('container import ok')"
      - name: Container startup, readiness, logs and graceful shutdown
        run: scripts/check-container.sh muniramarket-core-api:ci

  workers:
    name: Cloudflare Workers (vinext) and launch config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Offline: no Cloudflare account, token or network resource is involved.
      - name: Worker typecheck (generated binding types)
        run: |
          pnpm --filter @muniramarket/web typecheck:worker
          pnpm --filter @muniramarket/admin typecheck:worker
          pnpm --filter @muniramarket/api-gateway typecheck
      - name: Worker builds (staging and production configuration)
        run: |
          for app in web admin; do
            pnpm --filter "@muniramarket/$app" build:worker
            pnpm --filter "@muniramarket/$app" build:worker:production
          done
      - name: Core API gateway build (Worker bundle + container image)
        working-directory: services/api-gateway
        run: pnpm exec cf build --mode staging
      - name: Security headers on the Workers runtime (local previews)
        run: |
          nohup pnpm --filter @muniramarket/web preview:worker > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          nohup pnpm --filter @muniramarket/admin preview:worker > "$RUNNER_TEMP/admin-preview.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:3100/robots.txt \
              && curl -fsS -o /dev/null http://localhost:3101/robots.txt && break
            sleep 1
          done
          node infra/cloudflare/scripts/smoke.mts --local \
            --web http://localhost:3100 --admin http://localhost:3101
      - name: Deploy-time configuration validation (fixture values)
        env:
          MM_WEB_HOSTNAME: shop.staging.example.test
          MM_ADMIN_HOSTNAME: admin.staging.example.test
          MM_API_HOSTNAME: api.staging.example.test
          MM_TELEGRAM_BOT_ID: '1234567890'
          MM_TELEGRAM_BOT_USERNAME: muniramarket_ci_bot
          MM_CSRF_TRUSTED_ORIGINS: https://shop.staging.example.test,https://admin.staging.example.test
        run: |
          node infra/cloudflare/scripts/validate-deploy-env.mts --mode staging
          # Production must refuse fixture hostnames and a missing image digest (fail closed).
          if node infra/cloudflare/scripts/validate-deploy-env.mts --mode production; then
            echo "production accepted an incomplete configuration" >&2
            exit 1
          fi
      - name: Upload preview logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workers-preview-logs
          path: ${{ runner.temp }}/*-preview.log
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: Contracts up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/api
      - name: Regenerate OpenAPI document and TypeScript contracts
        run: pnpm contracts:generate
      - name: Fail if the committed contracts are stale
        run: |
          if ! git diff --exit-code -- packages/contracts \
            || [ -n "$(git status --porcelain -- packages/contracts)" ]; then
            echo "::error title=Contracts are out of date::packages/contracts differs from what the Core API generates. Run 'pnpm contracts:generate' and commit packages/contracts/openapi.json and packages/contracts/src/generated/openapi.ts."
            git status --short -- packages/contracts
            exit 1
          fi

  e2e:
    # Name kept as is (branch protection may require it); the job also runs the admin specs.
    name: Storefront E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muniramarket_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d muniramarket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throw-away, CI-only configuration; nothing here is a secret. The bot token is generated
      # per run below and never leaves this job.
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
      REDIS_URL: redis://localhost:6379/0
      SERVICE_AUTH_KEYS: ci:ci-only-service-key-not-a-secret-000000
      TELEGRAM_BOT_ID: '0'
      SESSION_COOKIE_SECURE: 'false'
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      API_INTERNAL_URL: http://127.0.0.1:8000
      # Fake Telegram id of the admin the specs sign in as (created below); not a real account.
      E2E_ADMIN_TELEGRAM_ID: '990000001'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --locked
        working-directory: services/api
      - name: Prepare log directory and a throw-away Telegram bot token
        run: |
          token="900000:$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "E2E_TELEGRAM_BOT_TOKEN=$token" >> "$GITHUB_ENV"
          echo "E2E_LOG_DIR=$RUNNER_TEMP/e2e-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-logs"
      - name: Migrate and seed the database
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          make seed
      # Development/test only (the tool refuses elsewhere). Creates the placeholder admin the admin
      # specs sign in as through the Telegram Login Widget flow.
      - name: Create the E2E admin user
        working-directory: services/api
        run: uv run python -m app.dev.set_role "$E2E_ADMIN_TELEGRAM_ID" admin --create
      - name: Start the Core API
        working-directory: services/api
        # The Login Widget flag is set here, next to the token it requires: Settings refuses to
        # load with the flag on and no token, which would break the migrate/seed/set_role steps
        # above (they run before the token is handed to any process).
        env:
          TELEGRAM_BOT_TOKEN: ${{ env.E2E_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_LOGIN_WIDGET_ENABLED: 'true'
          TELEGRAM_BOT_USERNAME: muniramarket_e2e_bot
        run: |
          nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 \
            > "$E2E_LOG_DIR/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          echo "Core API did not become healthy" >&2
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @muniramarket/web build
      - run: pnpm --filter @muniramarket/admin build
      - run: pnpm --filter @muniramarket/web exec playwright install --with-deps chromium
      - name: Start the web app
        run: |
          nohup pnpm --filter @muniramarket/web start > "$E2E_LOG_DIR/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/uz && exit 0
            sleep 1
          done
          echo "Web app did not become ready" >&2
          exit 1
      - name: Start the admin app
        run: |
          nohup pnpm --filter @muniramarket/admin start > "$E2E_LOG_DIR/admin.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3001/uz && exit 0
            sleep 1
          done
          echo "Admin app did not become ready" >&2
          exit 1
      - name: Playwright E2E tests (storefront and admin)
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001
        run: pnpm --filter @muniramarket/web test:e2e
      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --config /repo/.gitleaks.toml
