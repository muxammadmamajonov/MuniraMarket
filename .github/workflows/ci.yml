name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Web, admin, packages, telegram
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  api:
    name: Core API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muniramarket_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d muniramarket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test
      # Real Alembic CLI against the CI database (public schema): upgrade, full downgrade, upgrade
      # again, then seed twice to prove the dev seed is idempotent. Tests use per-run schemas.
      - name: Migrations (upgrade / downgrade / upgrade) and idempotent seed
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
          SERVICE_AUTH_KEYS: ci:ci-only-service-key-not-a-secret-000000
          TELEGRAM_BOT_ID: '0'
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
          make seed
          make seed
      - run: make build

  core-api-function:
    # The production Core API: the `coreapi` Neon Function (Hono + pg). Unit tests also run in the
    # `js` job; here the integration suite runs against a real PostgreSQL migrated by the same
    # Alembic migrations production uses.
    name: Core API Function (Neon)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muniramarket_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d muniramarket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/muniramarket_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --locked
        working-directory: services/api
      - name: Migrate the test database (Alembic, as in production)
        working-directory: services/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
          SERVICE_AUTH_KEYS: ci:ci-only-service-key-not-a-secret-000000
          TELEGRAM_BOT_ID: '0'
        run: uv run alembic upgrade head
      - run: pnpm install --frozen-lockfile
      # infra/neon: SQL-created migrator/runtime roles, migrations as the migrator, runtime grants.
      # The runtime role must not change or remove audit_log rows, run DDL or reach another role;
      # FUNCTION_ROLE_TEST=1 also runs the Function's own Database class over an mm_app connection
      # (the production runtime connects as mm_app via MM_APP_DATABASE_URL, ADR 0016).
      - name: Neon role model (least privilege, append-only audit log, no escalation)
        env:
          ADMIN_URL: postgresql://ci:ci-only-password@localhost:5432/postgres
          FUNCTION_ROLE_TEST: '1'
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          infra/neon/scripts/verify-roles.sh
      - working-directory: services/core-api-function
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

  workers:
    name: Cloudflare Workers (vinext) and launch config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Offline: no Cloudflare account, token or network resource is involved.
      - name: Worker typecheck (generated binding types)
        run: |
          pnpm --filter @muniramarket/web typecheck:worker
          pnpm --filter @muniramarket/admin typecheck:worker
          pnpm --filter @muniramarket/api-gateway typecheck
      - name: Worker builds (staging and production configuration)
        run: |
          for app in web admin; do
            pnpm --filter "@muniramarket/$app" build:worker
            pnpm --filter "@muniramarket/$app" build:worker:production
          done
      - name: Core API gateway build (Worker bundle, no container)
        working-directory: services/api-gateway
        run: pnpm exec cf build --mode staging
      - name: Security headers on the Workers runtime (local previews)
        run: |
          nohup pnpm --filter @muniramarket/web preview:worker > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          nohup pnpm --filter @muniramarket/admin preview:worker > "$RUNNER_TEMP/admin-preview.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:3100/robots.txt \
              && curl -fsS -o /dev/null http://localhost:3101/robots.txt && break
            sleep 1
          done
          node infra/cloudflare/scripts/smoke.mts --local \
            --web http://localhost:3100 --admin http://localhost:3101
      - name: Deploy-time configuration validation (fixture values)
        env:
          MM_WEB_HOSTNAME: shop.staging.example.test
          MM_ADMIN_HOSTNAME: admin.staging.example.test
          MM_API_HOSTNAME: api.staging.example.test
          MM_TELEGRAM_BOT_ID: '1234567890'
          MM_CSRF_TRUSTED_ORIGINS: https://shop.staging.example.test,https://admin.staging.example.test
        run: |
          node infra/cloudflare/scripts/validate-deploy-env.mts --mode staging
          # Production must refuse fixture hostnames and a missing release (fail closed).
          if node infra/cloudflare/scripts/validate-deploy-env.mts --mode production; then
            echo "production accepted an incomplete configuration" >&2
            exit 1
          fi
      - name: Upload preview logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workers-preview-logs
          path: ${{ runner.temp }}/*-preview.log
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: Contracts up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
        working-directory: services/api
      - name: Regenerate OpenAPI document and TypeScript contracts
        run: pnpm contracts:generate
      - name: Fail if the committed contracts are stale
        run: |
          if ! git diff --exit-code -- packages/contracts \
            || [ -n "$(git status --porcelain -- packages/contracts)" ]; then
            echo "::error title=Contracts are out of date::packages/contracts differs from what the Core API generates. Run 'pnpm contracts:generate' and commit packages/contracts/openapi.json and packages/contracts/src/generated/openapi.ts."
            git status --short -- packages/contracts
            exit 1
          fi

  e2e:
    # Name kept as is (branch protection may require it); the job also runs the admin specs.
    name: Storefront E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muniramarket_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d muniramarket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throw-away, CI-only configuration; nothing here is a secret. The bot token and the OIDC
      # client secret are generated per run below and never leave this job.
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
      SERVICE_AUTH_KEYS: ci:ci-only-service-key-not-a-secret-000000
      TELEGRAM_BOT_ID: '0'
      SESSION_COOKIE_SECURE: 'false'
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
      API_INTERNAL_URL: http://127.0.0.1:8000
      # Fake Telegram id of the admin the specs sign in as (created below); not a real account.
      E2E_ADMIN_TELEGRAM_ID: '990000001'
      # Fake Telegram OIDC provider (apps/web/e2e/fake-telegram-oidc.ts) the admin specs sign in
      # through; a made-up client id, the secret is generated per run.
      E2E_OIDC_CLIENT_ID: '7000000001'
      E2E_OIDC_ISSUER: http://127.0.0.1:8899
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --locked
        working-directory: services/api
      - name: Prepare log directory, a throw-away Telegram bot token and OIDC client secret
        run: |
          token="900000:$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          echo "E2E_TELEGRAM_BOT_TOKEN=$token" >> "$GITHUB_ENV"
          oidc_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$oidc_secret"
          echo "E2E_OIDC_CLIENT_SECRET=$oidc_secret" >> "$GITHUB_ENV"
          echo "E2E_LOG_DIR=$RUNNER_TEMP/e2e-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-logs"
      - name: Migrate and seed the database
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          make seed
      # Development/test only (the tool refuses elsewhere). Creates the placeholder admin the admin
      # specs sign in as through the Telegram OIDC flow (fake provider).
      - name: Create the E2E admin user
        working-directory: services/api
        run: uv run python -m app.dev.set_role "$E2E_ADMIN_TELEGRAM_ID" admin --create
      # Dependency-free Node script (no pnpm install needed); signs every login in as
      # E2E_ADMIN_TELEGRAM_ID. Its own self-check runs first on a random port.
      - name: Start the fake Telegram OIDC provider
        working-directory: apps/web
        run: |
          node e2e/fake-telegram-oidc.ts --self-check
          nohup node e2e/fake-telegram-oidc.ts > "$E2E_LOG_DIR/fake-oidc.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$E2E_OIDC_ISSUER/health" && exit 0
            sleep 1
          done
          echo "Fake OIDC provider did not start" >&2
          exit 1
      - run: pnpm install --frozen-lockfile
      # The production Core API code (the `coreapi` Neon Function) behind its local gateway
      # stand-in (services/core-api-function/scripts/dev-server.ts: development/test only, a
      # per-process gateway secret). The OIDC settings are set here only, next to the secret they
      # require: Settings refuse OIDC without a secret, which would break the migrate/seed/set_role
      # steps above. The bot token is still needed for the storefront's Mini App initData.
      - name: Start the Core API (Neon Function code)
        working-directory: services/core-api-function
        env:
          # The Function reads only MM_APP_DATABASE_URL (pg URL); DATABASE_URL above is Alembic's.
          MM_APP_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/muniramarket_test
          TELEGRAM_BOT_TOKEN: ${{ env.E2E_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OIDC_ENABLED: 'true'
          TELEGRAM_OIDC_CLIENT_ID: ${{ env.E2E_OIDC_CLIENT_ID }}
          TELEGRAM_OIDC_CLIENT_SECRET: ${{ env.E2E_OIDC_CLIENT_SECRET }}
          TELEGRAM_OIDC_ISSUER: ${{ env.E2E_OIDC_ISSUER }}
          WEB_PUBLIC_ORIGIN: http://localhost:3000
          ADMIN_PUBLIC_ORIGIN: http://localhost:3001
        run: |
          nohup pnpm dev > "$E2E_LOG_DIR/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ready && exit 0
            sleep 1
          done
          echo "Core API did not become healthy" >&2
          exit 1
      - run: pnpm --filter @muniramarket/web build
      - run: pnpm --filter @muniramarket/admin build
      - run: pnpm --filter @muniramarket/web exec playwright install --with-deps chromium
      - name: Start the web app
        run: |
          nohup pnpm --filter @muniramarket/web start > "$E2E_LOG_DIR/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/uz && exit 0
            sleep 1
          done
          echo "Web app did not become ready" >&2
          exit 1
      # Same build, second instance with a placeholder (all-zero, not a real) Maps key, for
      # e2e/delivery-map.spec.ts. The spec serves a stub Yandex SDK via page.route and aborts
      # every other Yandex request, so nothing ever reaches Yandex.
      - name: Start the web app with a placeholder Maps key
        env:
          YANDEX_MAPS_API_KEY: 00000000-0000-4000-8000-000000000000
        working-directory: apps/web
        run: |
          nohup pnpm exec next start --port 3002 > "$E2E_LOG_DIR/web-maps.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3002/uz && exit 0
            sleep 1
          done
          echo "Web app (maps) did not become ready" >&2
          exit 1
      - name: Start the admin app
        run: |
          nohup pnpm --filter @muniramarket/admin start > "$E2E_LOG_DIR/admin.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3001/uz && exit 0
            sleep 1
          done
          echo "Admin app did not become ready" >&2
          exit 1
      # Two groups, each within the Core API's 10 logins per minute per IP (fixed windows): the
      # storefront specs first, then the admin specs (2 logins per OIDC sign-in) once the next
      # minute window has started. See apps/web/playwright.config.ts.
      - name: Playwright E2E tests (storefront)
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001
          E2E_SKIP_ADMIN: '1'
          E2E_MAPS_BASE_URL: http://localhost:3002
        run: pnpm --filter @muniramarket/web test:e2e
      - name: Playwright E2E tests (admin)
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_URL: http://localhost:3001
        run: |
          sleep $((61 - $(date +%s) % 60))
          pnpm --filter @muniramarket/web test:e2e admin-
      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --config /repo/.gitleaks.toml
