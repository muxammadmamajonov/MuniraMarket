name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Web, admin, packages, telegram
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  api:
    name: Core API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muniramarket_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d muniramarket_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test
      # Real Alembic CLI against the CI database (public schema): upgrade, full downgrade, upgrade
      # again, then seed twice to prove the dev seed is idempotent. Tests use per-run schemas.
      - name: Migrations (upgrade / downgrade / upgrade) and idempotent seed
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/muniramarket_test
          REDIS_URL: redis://localhost:6379/0
          SERVICE_AUTH_KEYS: ci:ci-only-service-key-not-a-secret-000000
          TELEGRAM_BOT_ID: '0'
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
          make seed
          make seed
      - run: make build
      - name: Build API container image
        run: docker build --tag muniramarket-core-api:ci .
      - name: Smoke-test API container image
        run: >-
          docker run --rm --entrypoint python muniramarket-core-api:ci
          -c "from app.main import create_app; print('container import ok')"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --config /repo/.gitleaks.toml
