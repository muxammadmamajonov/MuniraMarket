[project]
name = "muniramarket-core-api"
version = "0.1.0"
description = "MuniraMarket Core API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20,<1.21",
    "asyncpg>=0.32,<0.33",
    "cryptography>=50,<51",
    "fastapi==0.162.0",
    "pydantic>=2.14,<2.15",
    "pydantic-settings>=2.16,<2.17",
    "redis>=8.1,<8.2",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn>=0.54,<0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=2.4,<2.5",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17,<0.18",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "T20", "PTH",
    "TCH", "PL", "A", "ARG", "RET", "TRY",
]
ignore = [
    "TRY003",   # long messages in exception constructors are fine here
    "PLR2004",  # magic values in comparisons
    "PLR0913",  # explicit keyword-only signatures (signing helpers) are intentional
    "TC001", "TC002", "TC003",  # FastAPI/pydantic need runtime imports of annotation types
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002", "PLR0915"]
"alembic/**" = ["INP001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real PostgreSQL (set TEST_DATABASE_URL); skipped otherwise",
]
